<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HandScan Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@400;600;700&family=Lora:wght@400;700&family=Merriweather:wght@400;700&family=Noto+Sans+Sinhala:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&family=Noto+Serif+Sinhala:wght@400;700&family=Noto+Serif+Tamil:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3fb;--card:#fff;--tx:#1b1b2f;--mu:#6b7280;--ac:#5b3df5;--ac2:#0aa89a;--bd:#e4e5f1;--ok:#16a34a;--bad:#dc2626;--sh:0 2px 10px rgba(40,30,120,.08)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans Sinhala","Noto Sans Tamil","Iskoola Pota","Nirmala UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(120deg,#4527d8,#7b3ff2 55%,#0aa89a);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:22px;letter-spacing:.3px}
.top p{margin:2px 0 0;font-size:13px;opacity:.9}
.lang{display:flex;gap:6px}
.lang button{border:1px solid #fff8;background:#fff2;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600}
.lang button.on{background:#fff;color:#4527d8}
.steps{display:flex;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;overflow-x:auto}
.steps button{border:0;background:#eef0ff;color:var(--ac);padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap}
.steps button.on{background:var(--ac);color:#fff}
main{max-width:1280px;margin:0 auto;padding:16px}
.step{display:none}.step.on{display:block}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h2,.card h3{margin:0 0 10px}
.btn{border:0;background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.o{background:#fff;color:var(--ac);border:1px solid var(--ac)}
.btn.g{background:var(--ok)}.btn.r{background:var(--bad)}.btn.t{background:var(--ac2)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>*{flex:1;min-width:120px}
.row.nf>*{flex:0 0 auto;min-width:0}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin-bottom:3px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;padding:8px 10px;border:1px solid #cfd2e6;border-radius:8px;background:#fff}
input[type=color]{width:100%;height:36px;padding:2px;border:1px solid #cfd2e6;border-radius:8px;background:#fff}
input[type=range]{width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);font-weight:500;margin:6px 0}
.chk input{width:auto}
.muted{color:var(--mu);font-size:13px}
.drop{border:2px dashed #b9b4f5;border-radius:14px;background:#faf9ff;padding:30px 16px;text-align:center;cursor:pointer}
.drop.over{background:#efecff;border-color:var(--ac)}
.drop big{display:block;font-size:34px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.th{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#fff;position:relative}
.th img{width:100%;height:130px;object-fit:cover;display:block;background:#eee}
.th .bar{display:flex;gap:4px;padding:6px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.th .bar button{border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer;padding:2px 7px}
.badge{position:absolute;top:6px;left:6px;background:#000a;color:#fff;border-radius:999px;padding:1px 9px;font-size:12px}
.badge.done{background:#16a34add}.badge.busy{background:#d97706dd}.badge.err{background:#dc2626dd}
.ed{display:grid;grid-template-columns:130px 1fr;gap:14px}
.plist{display:flex;flex-direction:column;gap:8px;max-height:78vh;overflow:auto}
.pi{border:2px solid var(--bd);border-radius:10px;background:#fff;cursor:pointer;overflow:hidden;font-size:12px;text-align:center}
.pi.on{border-color:var(--ac)}
.pi img{width:100%;height:74px;object-fit:cover;display:block;background:#eee}
.pi .ph{height:74px;display:flex;align-items:center;justify-content:center;background:#f3f4f8;color:var(--mu)}
.pane{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.vbox{height:62vh;overflow:auto;border:1px solid var(--bd);border-radius:10px;background:#f8f8fb}
.vbox img{display:block;width:100%;transform-origin:top left}
.vhead,.tbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
#ta{height:62vh;resize:vertical;line-height:1.7;font-family:"Noto Sans Sinhala","Noto Sans Tamil",Inter,"Iskoola Pota","Nirmala UI",sans-serif}
.hint{background:#eefbf9;border:1px solid #b6ece6;color:#0b6b62;border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.warn{background:#fff7e6;border:1px solid #fde1a6;color:#8a5a00}
.dz{display:grid;grid-template-columns:340px 1fr;gap:14px}
.ctrl{max-height:80vh;overflow:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:9px 3px;cursor:pointer;font-weight:600;min-width:60px;font-size:13px;line-height:1.2}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tpls button{border:2px solid var(--bd);background:#fff;border-radius:10px;padding:8px;cursor:pointer;text-align:left;font-weight:600;font-size:13px}
.tpls button.on{border-color:var(--ac);background:#f2f0ff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
details{border-top:1px solid var(--bd);padding:8px 0;margin-top:8px}
summary{cursor:pointer;font-weight:700;color:var(--ac)}
.prev{background:#d9dae8;border-radius:14px;padding:14px;max-height:84vh;overflow:auto}
.pw{margin:0 auto 14px;position:relative;box-shadow:0 3px 14px rgba(0,0,0,.25);background:#fff}
.pw .pn{position:absolute;bottom:-1px;right:0;transform:translateY(100%);font-size:11px;color:#444;display:none}
.page{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page .content{position:absolute;overflow:hidden}
.ln{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:0}
.hdbar{position:absolute;font-size:12px;opacity:.75}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.exp .card{margin:0}
.exp .btn{width:100%;margin-top:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16162a;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:300;max-width:90vw}
#busy{position:fixed;inset:0;background:#fffffff2;z-index:250;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;text-align:center}
#busy .pb{width:min(420px,80vw);height:10px;border-radius:6px;background:#e3e3f3;overflow:hidden}
#busy .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));width:0}
.fab{position:fixed;right:18px;bottom:18px;z-index:90;border-radius:999px;padding:13px 20px;box-shadow:0 6px 20px rgba(80,50,230,.45)}
.chat{position:fixed;right:0;top:0;bottom:0;width:min(430px,100vw);background:#fff;z-index:120;box-shadow:-4px 0 24px rgba(0,0,0,.2);display:none;flex-direction:column}
.chat.open{display:flex}
.chat header{padding:12px 14px;background:linear-gradient(120deg,#4527d8,#7b3ff2);color:#fff;display:flex;gap:8px;align-items:center;justify-content:space-between}
.chat header select{width:auto;color:#222}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#f7f7fc}
.m{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.m.u{align-self:flex-end;background:var(--ac);color:#fff}
.m.a{align-self:flex-start;background:#fff;border:1px solid var(--bd)}
.m pre{margin:8px 0 0;padding:8px;background:#f1f2f8;border-radius:8px;white-space:pre-wrap;max-height:180px;overflow:auto;font:inherit;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--bd)}
.chips button{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}
.cin textarea{height:56px;resize:none}
#printRoot{display:none}
@media print{
 body>*:not(#printRoot){display:none!important}
 body{background:#fff}
 #printRoot{display:block!important}
 #printRoot .page{position:relative!important;box-shadow:none!important;break-after:page;page-break-after:always}
 #printRoot .page:last-child{break-after:auto;page-break-after:auto}
}
@media(max-width:900px){
 .ed{grid-template-columns:1fr}.plist{flex-direction:row;max-height:none}.pi{min-width:90px}
 .pane{grid-template-columns:1fr}.vbox{height:42vh}#ta{height:48vh}
 .dz{grid-template-columns:1fr}.ctrl{max-height:none}.prev{max-height:none}
}
</style>
</head>
<body>
<header class="top">
 <div><h1>✍️ HandScan Studio</h1><p data-i18n="tagline"></p></div>
 <div class="lang"><button data-l="en">EN</button><button data-l="si">සිං</button><button data-l="ta">தமிழ்</button></div>
</header>
<nav class="steps" id="steps"></nav>
<main>

<!-- STEP 1 -->
<section class="step" id="s1">
 <div class="card">
  <div class="drop" id="drop"><big>📷</big><b data-i18n="dropTxt"></b><div class="muted" data-i18n="dropSub"></div></div>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <div class="row nf" style="margin-top:10px">
   <button class="btn o" id="btnCam" data-i18n="camera"></button>
   <button class="btn o" id="btnManual" data-i18n="manual"></button>
   <button class="btn r sm" id="btnClear" data-i18n="clearAll"></button>
  </div>
  <div class="thumbs" id="thumbs"></div>
 </div>
 <div class="card">
  <h3 data-i18n="engineH"></h3>
  <div class="row">
   <div><label data-i18n="hwLang"></label><select id="ocrLang"><option value="auto" data-i18n="auto"></option><option value="si" data-i18n="si"></option><option value="en" data-i18n="en"></option><option value="ta" data-i18n="ta"></option><option value="mixed" data-i18n="mixed"></option></select></div>
   <div><label data-i18n="engine"></label><select id="engine"><option value="puter" data-i18n="e_puter"></option><option value="gemini" data-i18n="e_gemini"></option><option value="tess" data-i18n="e_tess"></option></select></div>
  </div>
  <div id="gemBox" style="display:none;margin-top:10px" class="row">
   <div style="flex:2"><label data-i18n="gkey"></label><input type="password" id="gkey" autocomplete="off" placeholder="AIza..."></div>
   <div><label data-i18n="model"></label><input type="text" id="gmodel"></div>
   <div style="flex:0 0 auto"><a class="btn o sm" target="_blank" rel="noopener" href="https://aistudio.google.com/apikey" data-i18n="getKey"></a></div>
  </div>
  <div id="putBox" style="margin-top:10px" class="row">
   <div><label><span data-i18n="model"></span> (<span data-i18n="optional"></span>)</label><input type="text" id="pmodel" list="pmodels" placeholder="default"><datalist id="pmodels"><option value="openai/gpt-5.4-nano"><option value="google/gemini-3.8-flash"><option value="claude-sonnet-4-6"><option value="gpt-6-luna"></datalist></div>
  </div>
  <label class="chk"><input type="checkbox" id="enhance"><span data-i18n="enhance"></span></label>
  <div class="hint" data-i18n="engineNote"></div>
  <div class="hint warn" data-i18n="privacy"></div>
  <button class="btn t" id="btnRead" style="font-size:16px;padding:12px 22px" data-i18n="readAll"></button>
 </div>
</section>

<!-- STEP 2 -->
<section class="step" id="s2">
 <div class="hint" data-i18n="editHint"></div>
 <div class="ed">
  <div class="plist" id="plist"></div>
  <div class="pane">
   <div class="card">
    <div class="vhead"><b data-i18n="photo"></b><input type="range" id="imgZoom" min="60" max="300" value="100" style="width:110px"><button class="btn o sm" id="rotL">⟲</button><button class="btn o sm" id="rotR">⟳</button></div>
    <div class="vbox" id="vbox"><img id="pimg" alt=""></div>
    <div id="noimg" class="muted" style="display:none" data-i18n="noImg"></div>
   </div>
   <div class="card">
    <div class="tbar"><b data-i18n="text"></b>
     <button class="btn o sm" id="bUndo" data-i18n="undo"></button><button class="btn o sm" id="bRedo" data-i18n="redo"></button>
     <button class="btn o sm" id="bCut" data-i18n="cut"></button><button class="btn o sm" id="bCopy" data-i18n="copy"></button><button class="btn o sm" id="bPaste" data-i18n="paste"></button><button class="btn o sm" id="bSel" data-i18n="selAll"></button>
    </div>
    <textarea id="ta" spellcheck="false"></textarea>
    <div class="tbar" style="margin-top:8px">
     <button class="btn o sm" id="bAgain" data-i18n="again"></button><button class="btn o sm" id="bAdd" data-i18n="addPage"></button><button class="btn o sm" id="bDel" data-i18n="delPage"></button><button class="btn o sm" id="bMerge" data-i18n="merge"></button><button class="btn o sm" id="bSplit" data-i18n="split"></button>
    </div>
    <details><summary data-i18n="findRep"></summary>
     <div class="row" style="margin-top:8px"><div><label data-i18n="find"></label><input type="text" id="fFind"></div><div><label data-i18n="repWith"></label><input type="text" id="fRep"></div></div>
     <div class="row nf" style="margin-top:8px"><button class="btn o sm" id="fOne" data-i18n="repPage"></button><button class="btn o sm" id="fAll" data-i18n="repAll"></button></div>
    </details>
   </div>
  </div>
 </div>
 <div class="row nf"><button class="btn o" data-go="1" data-i18n="back"></button><button class="btn" data-go="3" data-i18n="next"></button></div>
</section>

<!-- STEP 3 -->
<section class="step" id="s3">
 <div class="dz">
  <div class="card ctrl">
   <label data-i18n="outType"></label>
   <div class="seg" id="typeSeg"></div>
   <label style="margin-top:12px" data-i18n="template"></label>
   <div class="tpls" id="tpls"></div>
   <div id="designCtl">
   <details open><summary data-i18n="pageH"></summary>
    <div class="g2" style="margin-top:8px">
     <div><label data-i18n="size"></label><select data-k="size"><option>A4</option><option>A5</option><option>A6</option><option>B5</option><option>Letter</option><option>6x9</option></select></div>
     <div><label data-i18n="orient"></label><select data-k="orient"><option value="portrait" data-i18n="portrait"></option><option value="landscape" data-i18n="landscape"></option></select></div>
    </div>
    <div class="g3" style="margin-top:8px">
     <div><label data-i18n="mTop"></label><input type="number" data-k="mt" step="1" min="0"></div>
     <div><label data-i18n="mBottom"></label><input type="number" data-k="mb" step="1" min="0"></div>
     <div></div>
     <div><label data-i18n="mInner"></label><input type="number" data-k="mi" step="1" min="0"></div>
     <div><label data-i18n="mOuter"></label><input type="number" data-k="mo" step="1" min="0"></div>
    </div>
    <div style="margin-top:8px"><label data-i18n="pageNums"></label><select data-k="pageNums"><option value="none" data-i18n="none"></option><option value="center" data-i18n="pnCenter"></option><option value="outside" data-i18n="pnOutside"></option><option value="topright" data-i18n="pnTop"></option></select></div>
   </details>
   <details open><summary data-i18n="textH"></summary>
    <div style="margin-top:8px"><label data-i18n="font"></label><select data-k="font"><option value="serif">Serif (Lora)</option><option value="sans">Sans (Inter)</option><option value="book">Book (Merriweather)</option><option value="hand">Handwriting (Caveat)</option><option value="hand2">Handwriting 2 (Patrick Hand)</option><option value="mono">Typewriter</option></select></div>
    <div class="g2" style="margin-top:8px">
     <div><label data-i18n="fontSize"></label><input type="number" data-k="fs" min="8" max="40" step="0.5"></div>
     <div><label data-i18n="indent"></label><input type="number" data-k="indent" min="0" max="80"></div>
    </div>
    <div style="margin-top:8px"><label><span data-i18n="lineSp"></span>: <b id="lhmv"></b></label><input type="range" data-k="lhm" min="1.1" max="3" step="0.05"></div>
    <div class="g2" style="margin-top:8px">
     <div><label data-i18n="align"></label><select data-k="align"><option value="left" data-i18n="aLeft"></option><option value="justify" data-i18n="aJust"></option><option value="center" data-i18n="aCenter"></option></select></div>
     <div><label data-i18n="ink"></label><input type="color" data-k="ink"></div>
    </div>
   </details>
   <details><summary data-i18n="paperH"></summary>
    <div class="g2" style="margin-top:8px">
     <div><label data-i18n="lines"></label><select data-k="lines"><option value="none" data-i18n="none"></option><option value="ruled" data-i18n="ruled"></option><option value="grid" data-i18n="gridL"></option><option value="dots" data-i18n="dotsL"></option></select></div>
     <div><label data-i18n="lineCol"></label><input type="color" data-k="lineColor"></div>
     <div><label data-i18n="paperCol"></label><input type="color" data-k="paper"></div>
     <div><label data-i18n="marginCol"></label><input type="color" data-k="marginColor"></div>
    </div>
    <label class="chk"><input type="checkbox" data-k="marginLine"><span data-i18n="marginLine"></span></label>
   </details>
   <details open><summary data-i18n="contentH"></summary>
    <div style="margin-top:8px"><label data-i18n="title"></label><input type="text" data-k="title"></div>
    <div class="g2" style="margin-top:8px"><div><label data-i18n="author"></label><input type="text" data-k="author"></div><div><label data-i18n="date"></label><input type="text" data-k="date"></div></div>
    <div style="margin-top:8px"><label data-i18n="recipient"></label><textarea data-k="recipient" rows="2"></textarea></div>
    <label class="chk"><input type="checkbox" data-k="keepBreaks"><span data-i18n="keepBreaks"></span></label>
    <label class="chk"><input type="checkbox" data-k="paraGap"><span data-i18n="paraGap"></span></label>
    <label class="chk"><input type="checkbox" data-k="perPhoto"><span data-i18n="perPhoto"></span></label>
    <label class="chk"><input type="checkbox" data-k="headings"><span data-i18n="headings"></span></label>
    <label class="chk"><input type="checkbox" data-k="titlePage"><span data-i18n="titlePage"></span></label>
    <label class="chk"><input type="checkbox" data-k="toc"><span data-i18n="toc"></span></label>
    <label class="chk"><input type="checkbox" data-k="runHead"><span data-i18n="runHead"></span></label>
   </details>
   </div>
  </div>
  <div>
   <div class="row nf" style="margin-bottom:8px;align-items:center"><b id="pcount"></b><span style="flex:1"></span><label style="margin:0" data-i18n="zoom"></label><input type="range" id="zoom" min="30" max="150" value="100" style="width:140px"></div>
   <div class="prev" id="prev"></div>
  </div>
 </div>
 <div class="row nf" style="margin-top:12px"><button class="btn o" data-go="2" data-i18n="back"></button><button class="btn" data-go="4" data-i18n="next"></button></div>
</section>

<!-- STEP 4 -->
<section class="step" id="s4">
 <div class="exp">
  <div class="card"><h3>📄 PDF</h3><div class="muted" data-i18n="pdfNote"></div>
   <div style="margin-top:8px"><label data-i18n="quality"></label><select id="q"><option value="1.5">Standard</option><option value="2" selected>High</option><option value="3">Max</option></select></div>
   <button class="btn g" id="xPdf" data-i18n="dlPdf"></button>
   <button class="btn o" id="xPrint" data-i18n="printPdf"></button>
  </div>
  <div class="card"><h3>📝 Text</h3>
   <label class="chk"><input type="checkbox" id="txtSep" checked><span data-i18n="txtSep"></span></label>
   <button class="btn" id="xTxt" data-i18n="dlTxt"></button>
   <button class="btn o" id="xDoc" data-i18n="dlDoc"></button>
   <button class="btn o" id="xCopy" data-i18n="copyAll"></button>
  </div>
  <div class="card"><h3>💾 Backup</h3><div class="muted" data-i18n="bkNote"></div>
   <button class="btn o" id="xBk" data-i18n="dlBk"></button>
   <button class="btn o" id="xRs" data-i18n="restore"></button><input type="file" id="rsFile" accept=".json" hidden>

async function loadImg(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url})}

 const im=await loadImg(it.url),c=document.createElement('canvas'),sw=deg%180!==0;
 c.width=sw?im.naturalHeight:im.naturalWidth;c.height=sw?im.naturalWidth:im.naturalHeight;
 const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.drawImage(im,-im.naturalWidth/2,-im.naturalHeight/2);
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));URL.revokeObjectURL(it.url);it.file=b;it.url=URL.createObjectURL(b);
}
async function prepImage(it){
 const im=await loadImg(it.url),mx=2200,sc=Math.min(1,mx/Math.max(im.naturalWidth,im.naturalHeight));
 const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
 if(eng.enhance&&'filter' in x)x.filter='grayscale(1) contrast(1.35) brightness(1.05)';
 x.drawImage(im,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
 const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(blob)});
 return{blob,b64};
}

const LNAME={auto:'any language (auto-detect; the text may mix Sinhala, Tamil and English)',si:'Sinhala',en:'English',ta:'Tamil',mixed:'a mix of Sinhala, English and Tamil'};
function ocrPrompt(){return `You are an expert handwriting OCR engine. Transcribe ALL handwritten text in the image exactly as written.
Language: ${LNAME[eng.ocrLang]||LNAME.auto}.
Rules:
- Keep the original script. Never translate or transliterate.
- Keep line breaks exactly as in the image (one output line per written line). Leave a blank line where there is a clear paragraph gap.
- Do NOT correct spelling, grammar or punctuation. Copy mistakes exactly as written.
- Read Sinhala and Tamil letters very carefully (for example Sinhala ල/ළ, න/ණ, ශ/ෂ/ස, ත/ථ, ද/ධ, vowel signs and conjuncts).
- If a word is truly unreadable write [?].
- Ignore ruled lines, margins, stains and page edges.
- Output ONLY the transcription: no explanations, no markdown, no quotes.`}
function puterText(r){if(typeof r==='string')return r;const c=(r&&r.message&&r.message.content)!=null?r.message.content:(r&&r.text)!=null?r.text:r;if(Array.isArray(c))return c.map(x=>x.text||'').join('');if(typeof c==='string')return c;return String(r)}
async function callPuter(prompt,blob){
 await loadScript('https://js.puter.com/v2/');
 const opt=eng.pmodel.trim()?{model:eng.pmodel.trim()}:undefined;
 const file=blob?new File([blob],'page.jpg',{type:'image/jpeg'}):null;
 let r;
 if(file) r=opt?await puter.ai.chat(prompt,file,opt):await puter.ai.chat(prompt,file);
 else r=opt?await puter.ai.chat(prompt,opt):await puter.ai.chat(prompt);
 return puterText(r);
}
async function callGemini(prompt,b64){
 if(!eng.gkey.trim())throw new Error(tt('needKey'));
 const parts=[{text:prompt}];if(b64)parts.push({inline_data:{mime_type:'image/jpeg',data:b64}});
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(eng.gmodel.trim()||'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(eng.gkey.trim())}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:0}})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
 const p=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
 if(!p)throw new Error('Empty response ('+((j.promptFeedback&&j.promptFeedback.blockReason)||'no text')+')');
 return p.map(x=>x.text||'').join('');
}
async function callTess(it){
 await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
 const map={auto:'eng+sin+tam',si:'sin',en:'eng',ta:'tam',mixed:'sin+eng'};
 const {blob}=await prepImage(it);

 return r.data.text;
}
function cleanOcr(s){return String(s||'').replace(/^```[a-z]*\n?/i,'').replace(/\n?```$/,'').replace(/\r/g,'').replace(/[ \t]+$/gm,'').replace(/\n{4,}/g,'\n\n\n').trim()}
async function ocrOne(it){

  let tx;
  if(eng.engine==='tess')tx=await callTess(it);
  else{const {blob,b64}=await prepImage(it);tx=eng.engine==='gemini'?await callGemini(ocrPrompt(),b64):await callPuter(ocrPrompt(),blob)}
  it.text=cleanOcr(tx);it.status='done';

const SIZES={A4:[210,297],A5:[148,210],A6:[105,148],B5:[176,250],Letter:[215.9,279.4],'6x9':[152.4,228.6]};
const PX=v=>v*96/25.4;

function metrics(){
 let [w,h]=SIZES[d.size]||SIZES.A4;if(d.orient==='landscape'&&d.type!=='book')[w,h]=[h,w];
 const lh=Math.max(8,Math.round(d.fs*d.lhm));
 const M={wmm:w,hmm:h,W:Math.round(PX(w)),H:Math.round(PX(h)),lh,mt:PX(d.mt),mb:PX(d.mb),mi:PX(d.mi),mo:PX(d.mo)};
 M.cw=Math.max(60,Math.round(M.W-M.mi-M.mo));M.n=Math.max(1,Math.floor((M.H-M.mt-M.mb)/lh));M.cH=M.n*lh;return M;
}
function linesOf(text,forceHead){
 text=String(text||'').replace(/\r/g,'');
 if(d.keepBreaks)return text.split('\n');
 const heads=d.headings||forceHead,out=[];let buf=[];
 const flush=(blank)=>{if(buf.length){if(out.length&&d.paraGap&&out[out.length-1]!=='')out.push('');out.push(buf.join(' '));buf=[]}};
 text.split('\n').forEach(raw=>{const l=raw.trim();
  if(!l){flush();return}
  if(heads&&/^#{1,2}\s+/.test(l)){flush();if(out.length&&d.paraGap&&out[out.length-1]!=='')out.push('');out.push(l);if(d.paraGap)out.push('');return}
  buf.push(l)});
 flush();while(out.length&&out[out.length-1]==='')out.pop();return out;
}
function makeSections(){
 const texts=items.map(i=>i.text||'');let secs=[];
 if(d.type==='book'){
  const all=linesOf(texts.join('\n'),true);let c={title:null,lines:[]};
  all.forEach(l=>{const m=l.match(/^#{1,2}\s+(.*)$/);if(m){if(c.title!==null||c.lines.some(x=>x.trim()))secs.push(c);c={title:m[1].trim(),lines:[]}}else c.lines.push(l)});
  secs.push(c);secs=secs.filter(s=>s.title!==null||s.lines.some(x=>x.trim()));
  secs.forEach(s=>{while(s.lines.length&&!s.lines[0].trim())s.lines.shift();while(s.lines.length&&!s.lines[s.lines.length-1].trim())s.lines.pop()});
 }else if(d.perPhoto&&items.length>1){secs=texts.map(tx=>({title:null,lines:linesOf(tx)}))}
 else secs=[{title:null,lines:linesOf(texts.join('\n'))}];
 if(!secs.length)secs=[{title:null,lines:['']}];return secs;
}

  case'exam':{
   const el=document.createElement('div');

   mk([['f_name',d.author,2],['f_date',d.date,1]]);mk([['f_subject',d.title,2],['f_marks','',1]]);
   const sp=document.createElement('div');sp.style.height=M.lh+'px';el.appendChild(sp);el.style.height=M.lh*5+'px';el.style.background=d.paper;return el}
 }

}
function chapterHead(title,M){
 const el=document.createElement('div');el.style.height=M.lh*5+'px';
 el.innerHTML=`<div style="height:${M.lh*3}px;margin-top:${M.lh}px;margin-bottom:${M.lh}px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:1.5em;line-height:${M.lh}px;overflow:hidden">${esc(title)}</div>`;return el;
}
function measureSection(sec,M,isFirst){
 const flow=document.createElement('div');
 flow.style.cssText=`position:absolute;left:-99999px;top:0;width:${M.cw}px;font-size:${d.fs}px;line-height:${M.lh}px;text-align:${d.align};font-family:${FONTS[d.font]};visibility:hidden`;
 document.body.appendChild(flow);
 let head=null;
 if(d.type==='book'){if(sec.title!=null)head=chapterHead(sec.title,M)}else if(isFirst)head=specialHead(M);
 if(head)flow.appendChild(head);
 sec.lines.forEach(l=>flow.appendChild(lineEl(l)));
 let y=0;const nodes=[];
 [...flow.children].forEach(el=>{
  if(el!==head){const h=el.offsetHeight,k=Math.max(1,Math.round(h/M.lh));el.style.height=k*M.lh+'px'}
  el._t=y;y+=parseFloat(el.style.height);el._b=y;nodes.push(el)});
 flow.remove();return{nodes,total:y,hasHead:!!head};
}
function linesBG(M){
 const c=d.lineColor,lh=M.lh,fs=d.fs;
 if(d.lines==='ruled'){const y=Math.round(Math.min(lh-2,(lh-fs*1.2)/2+fs*1.2));return{img:`linear-gradient(to bottom,transparent ${y}px,${c} ${y}px,${c} ${y+1}px,transparent ${y+1}px)`,size:`100% ${lh}px`}}
 if(d.lines==='grid')return{img:`linear-gradient(to bottom,transparent ${lh-1}px,${c} ${lh-1}px),linear-gradient(to right,transparent ${lh-1}px,${c} ${lh-1}px)`,size:`${lh}px ${lh}px`};
 if(d.lines==='dots')return{img:`radial-gradient(circle at ${lh-1}px ${lh-1}px,${c} 1.3px,transparent 1.8px)`,size:`${lh}px ${lh}px`};
 return null;
}
function basePage(M){const pg=document.createElement('div');pg.className='page';pg.style.cssText=`width:${M.W}px;height:${M.H}px;background:${d.paper};color:${d.ink};font-family:${FONTS[d.font]};font-size:${d.fs}px`;return pg}
function sides(M,no){return(d.type==='book'&&no%2===0)?[M.mo,M.mi]:[M.mi,M.mo]}
function addBars(pg,M,no,title,showHead){
 const [ml,mr]=sides(M,no);
 if(d.pageNums!=='none'&&no){const e=document.createElement('div');e.className='hdbar';e.textContent=no;e.style.fontSize='12px';
  if(d.pageNums==='center'){e.style.cssText+=`left:0;right:0;text-align:center;bottom:${Math.max(4,M.mb/2-8)}px`}
  else if(d.pageNums==='outside'){const right=(d.type!=='book')||no%2===1;e.style.cssText+=`bottom:${Math.max(4,M.mb/2-8)}px;${right?`right:${mr}px`:`left:${ml}px`}`}
  else e.style.cssText+=`top:${Math.max(4,M.mt/2-8)}px;right:${mr}px`;
  pg.appendChild(e)}
 if(showHead&&d.runHead&&d.type==='book'){const t=(no%2===0?(d.author||d.title):d.title)||'';if(t){const e=document.createElement('div');e.className='hdbar';e.textContent=t;e.style.cssText+=`left:${ml}px;right:${mr}px;text-align:center;font-style:italic;top:${Math.max(4,M.mt/2-8)}px`;pg.appendChild(e)}}
}
function flowPage(M,sec,pi,no,showHead){
 const pg=basePage(M);const [ml]=sides(M,no);
 if(d.type==='paper'&&d.marginLine){const x=ml-PX(3.5);const ml1=document.createElement('div');ml1.style.cssText=`position:absolute;top:0;bottom:0;left:${x}px;width:1.5px;background:${d.marginColor}`;pg.appendChild(ml1);if(d.tpl==='legal'){const m2=ml1.cloneNode();m2.style.left=(x+4)+'px';pg.appendChild(m2)}}
 const ct=document.createElement('div');ct.className='content';
 ct.style.cssText=`left:${ml}px;top:${M.mt}px;width:${M.cw}px;height:${M.cH}px;font-size:${d.fs}px;line-height:${M.lh}px;text-align:${d.align}`;
 const bg=linesBG(M);if(bg){ct.style.backgroundImage=bg.img;ct.style.backgroundSize=bg.size;ct.style.backgroundRepeat='repeat'}
 const inner=document.createElement('div');const start=pi*M.cH,end=start+M.cH;let first=null;
 sec.nodes.forEach(nd=>{if(nd._b>start+.5&&nd._t<end-.5){if(first===null)first=nd._t;inner.appendChild(nd.cloneNode(true))}});
 inner.style.marginTop=((first===null?0:first)-start)+'px';ct.appendChild(inner);pg.appendChild(ct);
 addBars(pg,M,no,null,showHead);return pg;
}
function titlePageEl(M){
 const pg=basePage(M),w=document.createElement('div');
 w.style.cssText=`position:absolute;left:${M.mi}px;right:${M.mo}px;top:${M.H*.3}px;text-align:center`;
 w.innerHTML=`<div style="font-size:${d.fs*2.2}px;font-weight:700;line-height:1.25;overflow-wrap:anywhere">${esc((d.title||'').trim()||tt('untitled'))}</div>`+(d.author?`<div style="margin-top:${d.fs*3}px;font-size:${d.fs*1.25}px;opacity:.85">${esc(d.author)}</div>`:'')+(d.date?`<div style="margin-top:${d.fs}px;font-size:${d.fs}px;opacity:.65">${esc(d.date)}</div>`:'');
 pg.appendChild(w);return pg;
}
function tocPageEl(M,entries){
 const pg=basePage(M),w=document.createElement('div');
 w.style.cssText=`position:absolute;left:${M.mi}px;width:${M.cw}px;top:${M.mt}px;line-height:${M.lh}px`;
 let h=`<div style="text-align:center;font-weight:700;font-size:1.5em;height:${M.lh*3}px;line-height:${M.lh*2}px">${esc(tt('contents'))}</div>`;
 const maxRows=Math.max(1,M.n-3);
 entries.slice(0,maxRows).forEach(e=>{h+=`<div style="display:flex;gap:6px;height:${M.lh}px;overflow:hidden"><span style="white-space:nowrap;max-width:85%;overflow:hidden;text-overflow:ellipsis">${esc(e.t)}</span><span style="flex:1;border-bottom:1px dotted #777;margin-bottom:${Math.round(M.lh*.3)}px"></span><span>${e.p}</span></div>`});
 w.innerHTML=h;pg.appendChild(w);return pg;
}
async function buildDoc(){
 await fontsReady();
 const M=metrics(),secs=makeSections();
 const meas=secs.map((s,i)=>measureSection(s,M,i===0));
 const pages=[];let front=0;
 const wantTitle=(d.type==='book'||d.special==='report')&&d.titlePage;
 const entries=[];let bodyNo=1;
 const counts=meas.map(m=>Math.max(1,Math.ceil((m.total-.01)/M.cH)));
 const wantToc=d.type==='book'&&d.toc&&secs.some(s=>s.title);
 secs.forEach((s,i)=>{if(s.title)entries.push({t:s.title,p:bodyNo});bodyNo+=counts[i]});
 if(wantTitle)pages.push(titlePageEl(M));
 if(wantToc)pages.push(tocPageEl(M,entries));
 let no=1;
 secs.forEach((s,i)=>{for(let p=0;p<counts[i];p++){pages.push(flowPage(M,meas[i],p,no,!(p===0&&meas[i].hasHead&&d.type==='book')));no++}});
 return{pages,M};
}

function fullText(sep){return items.map(i=>(i.text||'').replace(/\r/g,'').replace(/\s+$/,'')).join(sep?'\n\n':'\n')}
const txtSep=()=>$('#txtSep').checked;

function exportDoc(){
 const secs=items.map(i=>i.text||'').join(txtSep()?'\n\n':'\n').split('\n');
 const body=secs.map(l=>{const m=l.match(/^#{1,2}\s+(.*)$/);return m?`<h2>${esc(m[1])}</h2>`:`<p style="margin:0">${l.trim()?esc(l):'&nbsp;'}</p>`}).join('\n');
 const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(d.title||'')}</title><style>body{font-family:"Iskoola Pota","Nirmala UI",Calibri,sans-serif;font-size:12pt;line-height:1.5}</style></head><body>${d.title?`<h1>${esc(d.title)}</h1>`:''}${body}</body></html>`;
 download(new Blob(['﻿'+html],{type:'application/msword'}),fname()+'.doc');toast(tt('saved'));
}
async function exportCopy(){try{await navigator.clipboard.writeText(fullText(txtSep()));toast(tt('copied'))}catch(e){toast('Copy failed')}}
async function exportPDF(){
 if(d.type==='text'){setType('pdf')}
 abort=false;busy(tt('preparing'),2);
 try{
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  const {pages,M}=await buildDoc();const sc=+$('#q').value||2;
  const host=document.createElement('div');host.style.cssText='position:absolute;left:0;top:0;z-index:-1;width:'+M.W+'px;height:'+M.H+'px';document.body.appendChild(host);
  window.scrollTo(0,0);const {jsPDF}=window.jspdf;let pdf;const o=M.wmm>M.hmm?'l':'p';
  for(let i=0;i<pages.length;i++){
   if(abort)throw new Error('cancelled');
   busy(`${tt('preparing')} ${i+1}/${pages.length}`,(i/pages.length)*100);
   host.innerHTML='';host.appendChild(pages[i]);await sleep(30);
   const cv=await html2canvas(pages[i],{scale:sc,backgroundColor:d.paper,logging:false,useCORS:true,scrollX:0,scrollY:0,width:M.W,height:M.H,windowWidth:Math.max(M.W,document.documentElement.clientWidth)});
   const img=cv.toDataURL('image/jpeg',.92);
   if(!pdf)pdf=new jsPDF({unit:'mm',format:[M.wmm,M.hmm],orientation:o,compress:true});else pdf.addPage([M.wmm,M.hmm],o);
   pdf.addImage(img,'JPEG',0,0,M.wmm,M.hmm,undefined,'FAST');
  }
  host.remove();pdf.save(fname()+'.pdf');toast(tt('saved'));
 }catch(e){if(String(e.message)!=='cancelled')toast('PDF: '+e.message,6000)}
 busyOff();
}

/* ================= AI chat ================= */
const msgs=[];
function renderChips(){
 const c=$('#chips');c.innerHTML='';
 const P={
  c_check:'Review the text for mistakes (spelling, wrong words, likely OCR/handwriting misreads). Do NOT change the text. List each issue as: original → suggestion.',
  c_verify:'Compare the attached photo with the text word by word. List every difference where the text does not match the handwriting. Then provide the corrected text so it matches the handwriting exactly (keep any spelling mistakes the writer made).',
  c_spell:'Fix spelling mistakes only. Keep wording, line breaks and language unchanged.',
  c_title:'Suggest a short fitting title and add it as a first line starting with "# ". Keep the rest unchanged.',
  c_poem:'Format this as a poem: short lines, a blank line between stanzas. Do not change any words.',
  c_clean:'Remove extra spaces and fix broken lines and paragraphs. Do not change any words.',
  c_si:'Translate the text to Sinhala. Keep the line structure.',c_en:'Translate the text to English. Keep the line structure.',c_ta:'Translate the text to Tamil. Keep the line structure.'};
 Object.keys(P).forEach(k=>{const b=document.createElement('button');b.textContent=tt(k);b.onclick=()=>sendChat(P[k],k==='c_verify');c.appendChild(b)});
}
function renderMsgs(){
 const el=$('#msgs');el.innerHTML='';
 msgs.forEach((m,i)=>{const b=document.createElement('div');b.className='m '+(m.r==='u'?'u':'a');
  b.textContent=m.t;
  if(m.rev!=null&&!m.done){const pre=document.createElement('pre');pre.textContent=m.rev;b.appendChild(pre);
   const row=document.createElement('div');row.className='row nf';row.style.marginTop='8px';
   const a=document.createElement('button');a.className='btn g sm';a.textContent=tt('apply');a.onclick=()=>applyRev(i);
   const x=document.createElement('button');x.className='btn o sm';x.textContent=tt('discard');x.onclick=()=>{m.done=1;renderMsgs()};
   row.append(a,x);b.appendChild(row)}
  el.appendChild(b)});
 el.scrollTop=el.scrollHeight;
}
function applyRev(i){
 const m=msgs[i];
 if(m.scope==='all'){
  const parts=m.rev.split(/^=== PAGE (\d+) ===[ \t]*\n?/m);
  if(parts.length>=3){const map={};for(let k=1;k<parts.length;k+=2)map[+parts[k]]=(parts[k+1]||'').replace(/\n+$/,'');
   items.forEach((it,idx)=>{if(map[idx+1]!=null)it.text=map[idx+1]})}
  else{items[0].text=m.rev;items=[items[0]];cur=0}
 }else{items[m.idx!=null?m.idx:cur].text=m.rev}
 m.done=1;renderMsgs();renderEditor();save();schedPreview();toast(tt('applied'));
}
async function sendChat(text,withImg){
 text=(text||'').trim();if(!text)return;
 if(!items.length){items.push(newItem(null,''))}
 const scope=$('#cScope').value;
 msgs.push({r:'u',t:text});msgs.push({r:'a',t:tt('working')});renderMsgs();
 const work=msgs[msgs.length-1];
 try{
  const lang={en:'English',si:'Sinhala',ta:'Tamil'}[L];
  const body=scope==='all'?items.map((it,i)=>`=== PAGE ${i+1} ===\n${it.text||''}`).join('\n'):(items[cur].text||'');
  const hist=msgs.slice(-9,-2).map(m=>(m.r==='u'?'User: ':'Assistant: ')+m.t.slice(0,500)).join('\n');
  const prompt=`You are the editing assistant inside a handwriting-to-document tool. Reply in ${lang}.
RULES:
- Never change the user's wording, spelling or language unless the user explicitly asks.
- If the user asks you to change / fix / format / translate / rewrite the text: write one or two short sentences explaining what you did, then give the COMPLETE revised text between the markers <<<TEXT and TEXT>>>${scope==='all'?' and keep every "=== PAGE n ===" line exactly as it is':''}.
- If the user only asks a question or wants a review: answer briefly WITHOUT those markers (use bullet points: original → suggestion).
The user's text (${scope==='all'?'all pages':'page '+(cur+1)}) is between TEXT START and TEXT END.
--- TEXT START ---
${body}
--- TEXT END ---
${hist?'Conversation so far:\n'+hist+'\n':''}User: ${text}`;
  let img=null;const it=items[cur];
  if(withImg){if(!it.file)throw new Error(tt('noImg'));img=await prepImage(it)}
  let out;
  if(eng.engine==='gemini')out=await callGemini(prompt,img&&img.b64);else out=await callPuter(prompt,img&&img.blob);
  const m=out.match(/<<<TEXT\n?([\s\S]*?)\n?TEXT>>>/);
  work.t=(m?out.replace(m[0],'').trim():out.trim())||'✓';
  if(m){work.rev=m[1];work.scope=scope;work.idx=cur}
 }catch(e){work.t='⚠ '+(e&&e.message||e)}
 renderMsgs();
}

 if(!TYPE_TPLS[d.type]&&d.type!=='text')d={...D0};
 applyLang();goStep(items.length&&items.some(i=>i.text)?2:1);
}
